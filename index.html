<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KenuColor | Professional Hair Color</title>

    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome Icons -->

<body>

<!-- LANGUAGE SCREEN -->
<div id="languageScreen" class="language-screen">
    <div class="language-box">
        <div class="language-logo">
            <span>Kenu</span>Color
        </div>

        <h1>Welcome to KenuColor</h1>
        <p>Choose your preferred language</p>

        <div class="language-buttons">
            <button class="language-btn english"
                onclick="selectLanguage('en')">
                English
            </button>

            <button class="language-btn urdu"
                onclick="selectLanguage('ur')">
                اردو
            </button>
        </div>
    </div>
</div>


<!-- MAIN WEBSITE -->
<div id="mainWebsite" class="hidden">

    <!-- NAVBAR -->

        <div class="container nav-container">

            <a href="#home" class="logo">
                <span>Kenu</span>Color
            </a>

            <nav id="navMenu">
                <a href="#home" data-en="Home" data-ur="ہوم">Home</a>
                <a href="#products" data-en="Hair Colors" data-ur="ہیئر کلرز">Hair Colors</a>
                <a href="#about" data-en="About Us" data-ur="ہمارے بارے میں">About Us</a>
                <a href="#reviews" data-en="Reviews" data-ur="ریویوز">Reviews</a>
                <a href="#contact" data-en="Contact" data-ur="رابطہ">Contact</a>
